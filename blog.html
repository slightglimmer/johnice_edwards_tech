  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-root="" data-page="blog">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" id="site-header"></header>

<main id="main">
<section class="page-head backdrop" aria-labelledby="page-title">
    <div class="wrap">
      <p class="eyebrow">The blog</p>
      <h1 id="page-title">All <em>articles</em></h1>
      <p class="lede">Everything I've written, newest first. Filter by section, search by keyword, or pick a topic tag.</p>
    </div>
  </section>

  <section class="section-tight" style="padding-top:0" aria-label="Articles">
    <div class="wrap">
      <div class="filters">
        <div class="chip-row" id="blog-filters" role="group" aria-label="Filter by section">
          <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="chip" type="button" data-filter="diaries" aria-pressed="false">Tech Diaries</button>
          <button class="chip" type="button" data-filter="ai" aria-pressed="false">AI &amp; Automation</button>
          <button class="chip" type="button" data-filter="systems" aria-pressed="false">Systems &amp; Cloud</button>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="visually-hidden" for="blog-search">Search articles</label>
          <input id="blog-search" type="search" placeholder="Search articles" autocomplete="off">
        </div>
      </div>
      <p class="active-tag" id="blog-tag" hidden>Tagged <strong></strong> <button type="button">Clear tag</button></p>
      <p class="result-count" id="blog-count" aria-live="polite"></p>
      <div class="grid grid-3" id="blog-list"></div>
      <div class="empty-state" id="blog-nomatch" hidden>
        <strong>No articles match that search</strong>
        <span>Try another word, or <button type="button" class="btn-text" id="blog-reset" style="background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;text-decoration:underline">show everything</button>.</span>
      </div>
    </div>
  </section>

  <section class="section-tight" aria-labelledby="tags-title">
    <div class="wrap">
      <h2 id="tags-title" style="font-size:22px;margin-bottom:16px">Browse by topic</h2>
      <ul class="tag-list" id="tag-cloud"></ul>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
</body>
</html>
