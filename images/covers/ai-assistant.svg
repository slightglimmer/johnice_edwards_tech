    <radialGradient id="b" cx="0.85" cy="0.15" r="0.6"><stop offset="0" stop-color="#B9A2FF" stop-opacity=".42"/><stop offset="1" stop-color="#B9A2FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#6E95FF"/><stop offset="1" stop-color="#C9A8FF"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
