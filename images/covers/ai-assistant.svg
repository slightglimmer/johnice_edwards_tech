      <text x="30" y="118" fill="#C9A8FF">window<tspan fill="#8C93A8">.</tspan><tspan fill="#E9ECF5">PROJECTS</tspan> <tspan fill="#8C93A8">= [{</tspan></text>
      <text x="60" y="166" fill="#FFB38F">slug<tspan fill="#8C93A8">: </tspan><tspan fill="#9EE6B8">'johnice-edwards-tech'</tspan><tspan fill="#8C93A8">,</tspan></text>
      <text x="60" y="214" fill="#FFB38F">status<tspan fill="#8C93A8">: </tspan><tspan fill="#9EE6B8">'in-progress'</tspan><tspan fill="#8C93A8">,</tspan></text>
      <text x="60" y="262" fill="#FFB38F">tech<tspan fill="#8C93A8">: [</tspan><tspan fill="#9EE6B8">'HTML'</tspan><tspan fill="#8C93A8">, </tspan><tspan fill="#9EE6B8">'CSS'</tspan><tspan fill="#8C93A8">, </tspan><tspan fill="#9EE6B8">'JS'</tspan><tspan fill="#8C93A8">],</tspan></text>
      <text x="60" y="310" fill="#FFB38F">featured<tspan fill="#8C93A8">: </tspan><tspan fill="#C9A8FF">true</tspan></text>
      <text x="30" y="358" fill="#8C93A8">}];</text>
