<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <title>How a browser finds a website: browser asks a DNS resolver, the resolver asks the root, .com and authoritative name servers, then the browser connects to GitHub Pages</title>
  <defs>
    <radialGradient id="a" cx="0.15" cy="0.2" r="0.6"><stop offset="0" stop-color="#4F7BFF" stop-opacity=".35"/><stop offset="1" stop-color="#4F7BFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="b" cx="0.9" cy="0.8" r="0.6"><stop offset="0" stop-color="#B9A2FF" stop-opacity=".3"/><stop offset="1" stop-color="#B9A2FF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9DB6FF"/></marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C9A8FF"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#0B0D14"/><rect width="1600" height="900" fill="url(#grid)"/><rect width="1600" height="900" fill="url(#a)"/><rect width="1600" height="900" fill="url(#b)"/>

  <!-- name servers row -->
  <g font-size="26" fill="#E9ECF5" text-anchor="middle">
    <g transform="translate(560 110)"><rect x="-130" y="0" width="260" height="96" rx="20" fill="#141826" stroke="#fff" stroke-opacity=".16" stroke-width="2"/><text y="44" font-weight="600">Root servers</text><text y="76" font-size="20" fill="#8C93A8">"ask .com"</text></g>
    <g transform="translate(860 110)"><rect x="-130" y="0" width="260" height="96" rx="20" fill="#141826" stroke="#fff" stroke-opacity=".16" stroke-width="2"/><text y="44" font-weight="600">.com servers</text><text y="76" font-size="20" fill="#8C93A8">"ask Namecheap"</text></g>
    <g transform="translate(1160 110)"><rect x="-150" y="0" width="300" height="96" rx="20" fill="#141826" stroke="#C9A8FF" stroke-opacity=".7" stroke-width="2"/><text y="44" font-weight="600">Namecheap DNS</text><text y="76" font-size="20" fill="#C9A8FF">holds my A + CNAME</text></g>
  </g>

  <!-- resolver -->
  <g transform="translate(560 430)" text-anchor="middle">
    <rect x="-170" y="-62" width="340" height="124" rx="24" fill="#141826" stroke="#6E95FF" stroke-width="2.5"/>
    <text y="-6" font-size="30" font-weight="600" fill="#E9ECF5">DNS resolver</text>
    <text y="30" font-size="21" fill="#8C93A8">usually your ISP or 1.1.1.1</text>
  </g>
  <g fill="none" stroke="#C9A8FF" stroke-width="2.5" stroke-dasharray="7 9">
    <path d="M520 368 L540 214" marker-end="url(#arrL)"/>
    <path d="M610 368 Q 740 260 840 214" marker-end="url(#arrL)"/>
    <path d="M680 380 Q 960 300 1120 214" marker-end="url(#arrL)"/>
  </g>
  <text x="60" y="250" font-size="22" fill="#C9A8FF">② the resolver walks the hierarchy</text>

  <!-- browser -->
  <g transform="translate(170 430)" text-anchor="middle">
    <rect x="-130" y="-80" width="260" height="160" rx="22" fill="#141826" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
    <path d="M-130 -58a22 22 0 0 1 22-22h216a22 22 0 0 1 22 22v18h-260z" fill="#fff" fill-opacity=".05"/>
    <circle cx="-104" cy="-60" r="6" fill="#FF8FA8"/><circle cx="-84" cy="-60" r="6" fill="#F4C67A"/><circle cx="-64" cy="-60" r="6" fill="#6FE3C8"/>
    <text y="10" font-size="28" font-weight="600" fill="#E9ECF5">Your browser</text>
    <text y="46" font-size="15" fill="#8C93A8" font-family="ui-monospace, Menlo, monospace">johniceedwardsrealty.com</text>
  </g>
  <path d="M305 410 H 384" stroke="#9DB6FF" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <path d="M384 456 H 305" stroke="#6FE3C8" stroke-width="3" fill="none" marker-end="url(#arr)" style="stroke:#6FE3C8"/>
  <text x="345" y="392" font-size="20" fill="#9DB6FF" text-anchor="middle">①</text>
  <text x="345" y="492" font-size="20" fill="#6FE3C8" text-anchor="middle">③</text>

  <!-- answer card -->
  <g transform="translate(250 640)">
    <rect width="620" height="170" rx="20" fill="#0F121B" stroke="#6FE3C8" stroke-opacity=".6" stroke-width="2"/>
    <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="22">
      <text x="28" y="46" fill="#6FE3C8">③ answer: A records</text>
      <text x="28" y="86" fill="#C3C8D8">185.199.108.153   185.199.109.153</text>
      <text x="28" y="122" fill="#C3C8D8">185.199.110.153   185.199.111.153</text>
      <text x="28" y="152" font-size="18" fill="#8C93A8">cached for the record's TTL</text>
    </g>
  </g>

  <!-- GitHub Pages -->
  <g transform="translate(1300 560)" text-anchor="middle">
    <rect x="-180" y="-110" width="360" height="220" rx="26" fill="#141826" stroke="#6FE3C8" stroke-width="2.5"/>
    <g transform="translate(-36 -86)" fill="none" stroke="#6FE3C8" stroke-width="3"><rect x="0" y="0" width="72" height="22" rx="5"/><rect x="0" y="30" width="72" height="22" rx="5"/><path d="M12 11h.01M12 41h.01"/></g>
    <text y="10" font-size="30" font-weight="600" fill="#E9ECF5">GitHub Pages</text>
    <text y="46" font-size="20" fill="#8C93A8">serves the HTML, CSS</text>
    <text y="74" font-size="20" fill="#8C93A8">and JavaScript</text>
  </g>
  <path d="M305 500 C 520 600, 880 560, 1112 560" stroke="#6FE3C8" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#arr)"/>
  <text x="760" y="532" font-size="22" fill="#6FE3C8" text-anchor="middle">④ connect over HTTPS</text>
</svg>
